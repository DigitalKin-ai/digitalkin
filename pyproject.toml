[project]
name = "digitalkin"
version = "0.0.1"
description = "SDK to build kin used in DigitalKin"
readme = "README.md"
requires-python = "==3.10.*"

keywords = [
    "digitalkin",
    "kin",
    "agent",
    "gprc",
    "sdk",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "License :: Other/Proprietary License",
]

dependencies = [
    "digitalkin-proto",
    "grpcio>=1.70.0",
    "pre-commit>=4.1.0",
    "protobuf>=5.29.3",
    "pydantic>=2.10.6",
    "pyright>=1.1.394",
    "pytest>=8.3.4",
    "ruff>=0.9.7",
    "typos>=1.29.9",
]

[[project.authors]]
name = "DigitalKin.ai"
email = "contact@digitalkin.ai"

[tool.uv]


[tool.ruff]
src = ["src"]
target-version = "py310"
line-length = 120
indent-width = 4
show-fixes = true
unsafe-fixes = true

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "W", "S", "I", "B","SIM"]
fixable = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
skip-magic-trailing-comma = false

[tool.pyright]
include = ["src"]
exclude = ["**/.venv", "**/__pycache__"]

[tool.pytest.ini_options]
pythonpath = "src"
