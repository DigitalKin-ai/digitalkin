[build-system]
    build-backend = "setuptools==83.0.0"
    requires      = [ "setuptools == 82.0.1", "wheel==0.46.3" ]

[project]

    description     = "SDK to build kin used in DigitalKin"
    license         = { file = "LICENSE" }
    name            = "digitalkin"
    readme          = "README.md"
    requires-python = ">=3.10"

    keywords = [ "agent", "digitalkin", "grpc", "kin", "sdk" ]

    classifiers = [
        "Development Status :: 3 - Alpha",
        "Intended Audience :: Developers",
        "License :: Other/Proprietary License",
        "Operating System :: OS Independent",
        "Programming Language :: Python :: 3 :: Only",
        "Programming Language :: Python :: 3.10",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python",
        "Topic :: Software Development :: Libraries",
    ]

    dependencies = [
        # Dev build: the only release carrying SUBAGENT_* events and event-level `metadata`,
        # which is how a nested run's output is attributed to its author. Pinned exactly
        # because it is a dated prerelease; move to >=0.1.21 once that ships stable.
        "ag-ui-protocol==0.1.21.dev1787220377",
        "agentic-mesh-protocol==1.0.1",
        "agno>=2.8.0,<3",
        "anyio>=4.13.0",
        "grpcio-health-checking==1.82.1",
        "grpcio-reflection==1.82.1",
        "grpcio-status==1.82.1",
        "pydantic-settings>=2.14.1",
        "pydantic>=2.12.4",
        "redis[hiredis]>=7.4.0,<9",
    ]
    version = "1.0.3"

    [project.optional-dependencies]
        agno = [ "agno>=2.6" ]
        performance = [ "uvloop>=0.21" ]
        profiling = [
            "pyinstrument>=5.1.2",
            "viztracer>=1.1.1",
            "yappi>=1.7.6",
        ]
    [project.urls]
        Documentation = "https://github.com/DigitalKin-ai/digitalkin"
        Homepage      = "https://github.com/DigitalKin-ai/digitalkin"
        Issues        = "https://github.com/DigitalKin-ai/digitalkin/issues"

    [[project.authors]]
        email = "contact@digitalkin.ai"
        name  = "DigitalKin.ai"

[dependency-groups]
    dev = [
        "build>=1.5.0",
        "bump-my-version>=1.3.0",
        "cryptography>=48.0.0",
        "mypy>=2.1.0",
        "pre-commit>=4.6.0",
        "pyright>=1.1.411",
        "ruff>=0.15.20",
        "twine>=6.2.0",
        "types-grpcio-health-checking>=1.0.0.20260518",
        "types-grpcio-reflection>=1.0.0.20260508",
        "types-grpcio>=1.82.1.20260711",
        "types-protobuf>=7.34.1.20260518",
        "typos>=1.48.0",
    ]
    docs = [
        "griffe-inherited-docstrings>=1.1.3",
        "markdown-callouts>=0.4.0",
        "markdown-exec>=1.12.1",
        "mike>=2.2.0",
        "mkdocs-autorefs>=1.4.4",
        "mkdocs-awesome-pages-plugin>=2.10.1",
        "mkdocs-coverage>=2.0.0",
        "mkdocs-git-committers-plugin-2>=2.5.0",
        "mkdocs-git-revision-date-localized-plugin>=1.5.2",
        "mkdocs-glightbox>=0.5.2",
        "mkdocs-include-markdown-plugin>=7.3.0",
        "mkdocs-literate-nav>=0.6.3",
        "mkdocs-llmstxt>=0.5.0",
        "mkdocs-material[imaging]>=9.7.6",
        "mkdocs-minify-plugin>=0.8.0",
        "mkdocs-open-in-new-tab>=1.0.8",
        "mkdocs-redirects>=1.2.3",
        "mkdocs-section-index>=0.3.12",
        "mkdocs>=1.6.1",
        "mkdocstrings-python>=2.0.3",
        "mkdocstrings>=1.0.4",
        "tomli>=2.4.1",
    ]
    tests = [
        "fakeredis[lua]>=2.35.1",
        "freezegun>=1.5.5",
        "grpcio-testing>=1.81.0",
        "hdrhistogram>=0.10.3",
        "hypothesis>=6.152.8",
        "objgraph>=3.6",
        "psutil>=7.2.2",
        "pytest-asyncio>=1.3.0",
        "pytest-benchmark>=5.2.3",
        "pytest-cov>=7.1.0",
        "pytest-html>=4.2.0",
        "pytest-json-report>=1.5.0",
        "pytest-timeout>=2.4.0",
        "pytest>=9.0.3",
    ]
[tool.setuptools]
    package-dir = { "" = "src" }

    [tool.setuptools.packages.find]
        where = [ "examples", "src" ]
[tool.ruff]

    indent-width   = 4
    line-length    = 120
    show-fixes     = true
    src            = [ "src" ]
    target-version = "py310"
    unsafe-fixes   = true
    # Enable preview features.
    exclude = [
        "*.md",
        ".bzr",
        ".direnv",
        ".eggs",
        ".git",
        ".git-rewrite",
        ".hg",
        ".mypy_cache",
        ".nox",
        ".pants.d",
        ".pytype",
        ".ruff_cache",
        ".svn",
        ".tox",
        ".venv",
        "__pypackages__",
        "_build",
        "buck-out",
        "build",
        "dist",
        "docs/*",
        "examples/*",
        "factory.py",
        "generate_certificates.py",
        "node_modules",
        "scripts",
        "tests/*",
        "venv",
    ]
    preview = true

    [tool.ruff.lint]
        select = [
            "A",     # flake8-builtins
            "ANN",   # flake8-annotations
            "ARG",   # flake8-unused-arguments
            "ASYNC", # flake8-async
            "C4",    # flake8-comprehensions
            "C90",   # mccabe (complex-structure)
            "COM",   # flake8-commas
            "D",     # pydocstyle
            "DOC",   # pydoclint
            "DTZ",   # flake8-datetimez
            "E",     # pycodestyle-errors
            "EM",    # flake8-errmsg
            "ERA",   # eradicate
            "F",     # pyflakes
            "FBT",   # flake8-boolean-trap
            "FLY",   # flynt
            "FURB",  # Refurb
            "G",     # flake8-logging-format
            "I",     # isort
            "ICN",   # flake8-import-conventions
            "ISC",   # flake8-implicit-str-concat
            "LOG",   # flake8-logging
            "N",     # pep8-naming
            "PERF",  # Perflint
            "PIE",   # flake8-pie
            "PL",    # Pylint
            "PL",    # Pylint
            "PT",    # flake8-pytest-style
            "PYI",   # flake8-pyi
            "Q",     # flake8-quotes
            "RET",   # flake8-return
            "RSE",   # flake8-raise
            "RUF",   # Ruff-specific rules
            "S",     # flake8-bandit
            "SIM",   # flake8-simplify
            "SLF",   # flake8-self
            "T20",   # flake8-print
            "TC",    # flake8-type-checking
            "TRY",   # tryceratops
            "UP",    # pyupgrade
            "W",     # pycodestyle-warnings
        ]

        ignore = [
            "ANN401",  # Allow typing.Any — gRPC stubs, callbacks, and dynamic APIs require it
            "COM812",  # Disable because of formatter incompatibility
            "DOC502",  # Allow extraneous-exception in docstring
            "F401",    # Allow unused imports — used for availability checks
            "N802",    # Allow PascalCase methods — gRPC servicer convention
            "PLC0415", # Allow lazy imports — needed to break circular dependencies
            "PLW3201", # Allow __get_pydantic_core_schema__ — Pydantic dunder hook
            "S105",    # Hardcoded-password
            "S403",    # Allow pickle import
        ]

        fixable = [ "ALL" ]

        [tool.ruff.lint.pydocstyle]
            convention = "google"

        [tool.ruff.lint.per-file-ignores]
            "tests/**/*.py" = [
                "ANN001",
                "ANN002",
                "ANN003",
                "ANN201",
                "ANN401",
                "ARG001",
                "ARG002",
                "C901",
                "D100",
                "D101",
                "D102",
                "D103",
                "D107",
                "D417",
                "DOC201",
                "DOC501",
                "E501",
                "ERA001",
                "FBT001",
                "FBT002",
                "G004",
                "N802",
                "PERF203",
                "PLC2701",
                "PLR0911",
                "PLR0912",
                "PLR0914",
                "PLR0915",
                "PLR1702",
                "PLR2004",
                "PLR6301",
                "S101",
                "SLF001",
                "TRY002",
            ]

        [tool.ruff.lint.pylint]
            max-args = 10

    [tool.ruff.format]
        docstring-code-format     = true
        indent-style              = "space"
        line-ending               = "auto"
        quote-style               = "double"
        skip-magic-trailing-comma = false

[tool.mypy]
    exclude                = [ "examples", "scripts", "tests" ]
    ignore_missing_imports = true
    warn_redundant_casts   = true
    warn_unused_ignores    = true

[tool.pytest.ini_options]

    asyncio_mode = "auto"
    log_cli      = false
    log_level    = "ERROR"
    python_files = "test_*.py"
    testpaths    = [ "tests" ]

    # Default timeout for tests (in seconds)
    timeout        = 10
    timeout_method = "signal" # More reliable for asyncio tests on Linux

    # Custom markers
    markers = [
        "chaos: marks fault injection tests (Redis outage, gRPC failure simulation)",
        "concurrency: marks tests for race conditions and concurrent access",
        "contract: marks gRPC proto contract verification tests",
        "e2e: marks end-to-end tests requiring full Docker Compose stack",
        "edge_case: marks tests for boundary conditions and edge cases",
        "flaky: marks known-flaky tests for the quarantine plugin (tests/fixtures/flakiness.py)",
        "grpc: marks tests for gRPC service functionality",
        "idempotency: marks tests for retry and duplicate request handling",
        "integration: marks tests that require external service connections (deselect with '-m \"not integration\"')",
        "property: marks property-based tests using Hypothesis",
        "regression: marks tests for previously fixed bugs",
        "smoke: marks critical path tests that should always pass",
        "stability: marks long-running stability and soak tests",
        "stress: marks stress/load tests for performance under pressure",
        "unit: marks a plain unit test with no other applicable category",
        "validation: marks tests for input validation and schema checking",
    ]
