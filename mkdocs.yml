site_name: DigitalKin
site_description: A modular framework for building AI agents with gRPC servers and flexible service strategies
docs_dir: docs
site_url: https://digitalkin.com
repo_url: https://github.com/DigitalKin-ai/digitalkin
repo_name: DigitalKin-ai/digitalkin
site_dir: "site"
watch: [mkdocs.yml, README.md, src]
copyright: Copyright &copy; 2025 Digitalkin
edit_uri: edit/main/docs/
exclude_docs: |
  validation_checklist.md

nav:
- Home: index.md
- Architecture: architecture.md
- Writing modules: module_authoring.md
- Contracts:
  - Gateway protocol: gateway_protocol.md
  - AG-UI events: agui_events.md
- Operations:
  - Deploy and tune: operations.md
  - Environment variables: environment_variables.md
- Testing: testing.md
- Changelog:
  - changelog/index.md
  - 1.0.5: changelog/1.0.5.md
  - 1.0.4: changelog/1.0.4.md
  - 1.0.2: changelog/1.0.2.md
  - 1.0.2.dev7: changelog/1.0.2.dev7.md
  - 1.0.2.dev6: changelog/1.0.2.dev6.md
  - 0.4.4: changelog/0.4.4.md
  - 0.4.3: changelog/0.4.3.md
  - 0.4.2: changelog/0.4.2.md
  - 0.4.1: changelog/0.4.1.md
  - 0.4.0: changelog/0.4.0.md
  - 0.3.5.dev0: changelog/0.3.5.dev0.md
- API reference: api/api.md

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
  - announce.dismiss
  - content.action.edit
  - content.action.view
  - content.code.annotate
  - content.code.copy
  - content.tooltips
  - navigation.footer
  - navigation.instant.preview
  - navigation.path
  - navigation.sections
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.top
  - search.highlight
  - search.suggest
  - toc.follow
  palette:
  - media: "(prefers-color-scheme)"
    toggle:
      icon: material/brightness-auto
      name: Switch to light mode
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: teal
    accent: purple
    toggle:
      icon: material/weather-sunny
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: black
    accent: lime
    toggle:
      icon: material/weather-night
      name: Switch to system preference

markdown_extensions:
- abbr
- attr_list
- admonition
- callouts:
    strip_period: no
- footnotes
- md_in_html
- pymdownx.blocks.admonition
- pymdownx.blocks.details
- pymdownx.blocks.tab:
    alternate_style: true
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
- pymdownx.highlight:
    pygments_lang_class: true
- pymdownx.magiclink
- pymdownx.snippets:
    base_path: [!relative $config_dir]
    check_paths: true
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.tasklist:
    custom_checkbox: true
- toc:
    permalink: "¤"

plugins:
- search
- mike
- autorefs
- markdown-exec
- section-index
- mkdocstrings:
    handlers:
      python:
        paths: [src]
        inventories:
        - https://docs.python.org/3/objects.inv
        - https://mkdocstrings.github.io/objects.inv
        - https://mkdocstrings.github.io/autorefs/objects.inv
        - https://mkdocstrings.github.io/griffe/objects.inv
        - https://python-markdown.github.io/objects.inv
        options:
          backlinks: tree
          docstring_options:
            ignore_init_summary: true
          docstring_section_style: list
          filters: public
          heading_level: 1
          inherited_members: true
          line_length: 88
          merge_init_into_class: true
          parameter_headings: true
          type_parameter_headings: true
          relative_crossrefs: true
          scoped_crossrefs: true
          separate_signature: true
          show_bases: false
          show_inheritance_diagram: true
          show_root_heading: true
          show_root_full_path: false
          show_signature_annotations: true
          show_signature_type_parameters: true
          show_source: false
          show_symbol_type_heading: true
          show_symbol_type_toc: true
          signature_crossrefs: true
          summary: true
          unwrap_annotated: true
- llmstxt:
    full_output: llms-full.txt
    sections:
      Guides:
      - index.md
      - architecture.md
      - module_authoring.md
      - operations.md
      - testing.md
      Contracts:
      - gateway_protocol.md
      - agui_events.md
      - environment_variables.md
      API:
      - api/api.md
- git-revision-date-localized:
    enabled: !ENV [DEPLOY, false]
    enable_creation_date: true
    type: timeago
- minify:
    minify_html: !ENV [DEPLOY, false]
- group:
    enabled: !ENV [MATERIAL_INSIDERS, false]
    plugins:
    - typeset

extra:
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/digitalkin-ai
  - icon: fontawesome/brands/python
    link: https://pypi.org/project/digitalkin/

  version:
    provider: mike
    default: stable
