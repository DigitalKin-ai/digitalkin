global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'digitalkin-modules'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:8081']
    metrics_path: '/metrics'
    # If modules expose metrics on different ports, add them here:
    # - targets: ['host.docker.internal:8082', 'host.docker.internal:8083']

  # Dynamic service discovery for multiple module servers
  # Uncomment and configure if using file-based service discovery:
  # - job_name: 'digitalkin-modules-dynamic'
  #   file_sd_configs:
  #     - files:
  #         - '/etc/prometheus/targets/*.json'
  #       refresh_interval: 30s
