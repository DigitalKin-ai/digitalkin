services:
  tests-redis:
    container_name: digitalkin-tests-redis
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6399}:6379"
    networks:
      - services-network
    command: >
      redis-server
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --save ""
        --appendonly no
        --protected-mode no
        --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  tests-toxiproxy:
    container_name: digitalkin-tests-toxiproxy
    profiles: ["chaos"]
    image: ghcr.io/shopify/toxiproxy:2.9.0
    ports:
      - "8474:8474"
      - "26379:26379"
    networks:
      - services-network
    depends_on:
      tests-redis:
        condition: service_healthy

  tests:
    container_name: digitalkin-tests
    build:
      context: .
      dockerfile: docker/Dockerfile.test
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.10}
    networks:
      - services-network
    environment:
      - TEST_SELECTOR=${TEST_SELECTOR:-tests/}
      - TEST_MARKER=${TEST_MARKER:-}
      - PYTEST_ARGS=${PYTEST_ARGS:-}
      # Reach Redis over the compose network (host port mapping is not visible from inside the container).
      - DIGITALKIN_REDIS_URL=${DIGITALKIN_REDIS_URL:-redis://tests-redis:6379/0}
      # When set, the integration fixture hard-fails instead of skipping if Redis is unreachable.
      - DIGITALKIN_REQUIRE_REDIS=${DIGITALKIN_REQUIRE_REDIS:-}
    depends_on:
      tests-redis:
        condition: service_healthy
    volumes:
      - .:/app:cached
      - /app/.venv
    working_dir: /app

networks:
  services-network:
    driver: bridge

volumes: {}
