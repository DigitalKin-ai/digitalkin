name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      test_selector:
        description: "Path to test module or selector to run (e.g., tests/integration/test_jobs.py)"
        required: false
        default: "tests/"
      pytest_args:
        description: "Additional pytest arguments (e.g., -k test_create_job -vv)"
        required: false
        default: ""
      python_version:
        description: "Python version to test (leave empty for all)"
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # SurrealDB Configuration
  TEST_SURREALDB_PORT: 8008
  TEST_SURREALDB_USERNAME: root
  TEST_SURREALDB_PASSWORD: root
  TEST_SURREALDB_NAMESPACE: test
  TEST_SURREALDB_DATABASE: test

  # Pytest Configuration
  PYTEST_TIMEOUT_SECONDS: 60
  DEFAULT_PYTEST_ARGS: "--json-report --json-report-file=test-metrics.json --html=pytest-report.html --junitxml=test-results.xml --cov --cov-report=xml:coverage.xml"

jobs:
  lint:
    name: Lint & Format Check - Python 3.10
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Go Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache UV dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: |
          uv pip install -e ".[tests,dev]" --system

      - name: Lint with Ruff
        run: uv run ruff check --output-format=github .

      - name: Format check with Ruff
        run: uv run ruff format --check .

      - name: Build package
        run: task build-package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-dist
          path: dist/
          retention-days: 7

  test:
    name: Test - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ github.event.inputs.python_version && fromJSON(format('["{0}"]', github.event.inputs.python_version)) || fromJSON('["3.10", "3.11", "3.12", "3.13"]') }}

    env:
      TEST_SURREALDB_PORT: 8008
      TEST_SURREALDB_USERNAME: root
      TEST_SURREALDB_PASSWORD: root
      TEST_SURREALDB_NAMESPACE: test
      TEST_SURREALDB_DATABASE: test
      PYTHON_VERSION: ${{ matrix.python-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-py${{ matrix.python-version }}-${{ hashFiles('**/Dockerfile', '**/docker-compose.yml', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-buildx-py${{ matrix.python-version }}-
            ${{ runner.os }}-buildx-

      - name: Validate Docker Compose configuration
        run: |
          if [ ! -f docker-compose.yml ]; then
            echo "::error::docker-compose.yml not found"
            exit 1
          fi
          docker compose config --quiet

      - name: Build Docker images
        run: |
          docker compose build --pull --progress=plain
        env:
          BUILDKIT_PROGRESS: plain
          DOCKER_BUILDKIT: 1

      - name: Start services and run tests
        run: |
          # Determine test selector and pytest args
          TEST_SELECTOR="${{ github.event.inputs.test_selector || 'tests/' }}"
          PYTEST_CUSTOM_ARGS="${{ github.event.inputs.pytest_args || '' }}"
          PYTEST_ARGS="${{ env.DEFAULT_PYTEST_ARGS }} ${PYTEST_CUSTOM_ARGS}"

          echo "::group::Test Configuration"
          echo "TEST_SELECTOR: ${TEST_SELECTOR}"
          echo "PYTEST_ARGS: ${PYTEST_ARGS}"
          echo "Python Version: ${{ matrix.python-version }}"
          echo "::endgroup::"

          # Run tests
          docker compose up \
            --exit-code-from tests \
            --abort-on-container-exit \
            --remove-orphans

          TEST_EXIT_CODE=$?
          echo "Tests exited with code ${TEST_EXIT_CODE}"

          exit ${TEST_EXIT_CODE}
        env:
          TEST_SELECTOR: ${{ github.event.inputs.test_selector || 'tests/' }}
          PYTEST_ARGS: ${{ env.DEFAULT_PYTEST_ARGS }} ${{ github.event.inputs.pytest_args }}

      - name: Dump docker logs on failure
        if: failure()
        run: |
          echo "::group::Docker Compose Logs"
          docker compose logs
          echo "::endgroup::"

      - name: Stop and cleanup containers
        if: always()
        run: |
          docker compose down --volumes --remove-orphans
          docker system prune -f --volumes

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            pytest-report.html
            test-results.xml
            test-metrics.json
          retention-days: 30


  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v5
        with:
          pattern: test-results-*
          path: test-results

      - name: Publish test summary
        run: |
          echo "# Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          for result_dir in test-results/test-results-*; do
            if [ -f "$result_dir/test-results.xml" ]; then
              python_version=$(basename "$result_dir" | sed 's/test-results-py//')
              echo "## Python ${python_version}" >> $GITHUB_STEP_SUMMARY

              # Parse JUnit XML (basic parsing)
              tests=$(grep -o 'tests="[0-9]*"' "$result_dir/test-results.xml" | head -1 | grep -o '[0-9]*')
              failures=$(grep -o 'failures="[0-9]*"' "$result_dir/test-results.xml" | head -1 | grep -o '[0-9]*')
              errors=$(grep -o 'errors="[0-9]*"' "$result_dir/test-results.xml" | head -1 | grep -o '[0-9]*')

              echo "- Total Tests: ${tests:-0}" >> $GITHUB_STEP_SUMMARY
              echo "- Failures: ${failures:-0}" >> $GITHUB_STEP_SUMMARY
              echo "- Errors: ${errors:-0}" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Check test status
        if: needs.test.result == 'failure'
        run: |
          echo "::error::Tests failed for one or more Python versions"
          exit 1

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true
