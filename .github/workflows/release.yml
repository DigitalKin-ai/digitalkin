name: Publish Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Verify tag matches pyproject.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(grep -Po '(?<=version = ")[^"]+' pyproject.toml | head -1)
          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "::error::Tag version ($TAG_VERSION) does not match pyproject.toml version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version check passed: $TAG_VERSION"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Go Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          uv pip install -e . --group dev --system

      - name: Build package
        run: task build-package

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          retention-days: 1

  publish-test-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write # pour trusted publishing

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Wait for Test PyPI availability and verify
        run: |
          MAX_ATTEMPTS=12
          SLEEP_SECONDS=10
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "Attempt $i/$MAX_ATTEMPTS: checking Test PyPI..."
            if python -m pip install \
              --index-url https://test.pypi.org/simple/ \
              --no-deps \
              digitalkin 2>/dev/null; then
              echo "Package found on Test PyPI, installing deps from PyPI..."
              python -m pip install digitalkin
              python -c "import digitalkin; print(f'Version: {digitalkin.__version__}')"
              exit 0
            fi
            echo "Not available yet, waiting ${SLEEP_SECONDS}s..."
            sleep $SLEEP_SECONDS
          done
          echo "::error::Package not available on Test PyPI after $((MAX_ATTEMPTS * SLEEP_SECONDS))s"
          exit 1

  publish-pypi:
    needs: [build, publish-test-pypi]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # pour trusted publishing

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
