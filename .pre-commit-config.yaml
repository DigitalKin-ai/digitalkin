exclude: |
  (?x)^(
      .gitignore
  )$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1024']  # 1 MB

      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [types-protobuf]
        exclude: "^(tests/|examples/)"

  # Add pytest as a local hook
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run --frozen pytest
        language: system
        pass_filenames: false
        always_run: true
        # Run with verbose output, fail on first error
        args: ["-xvs", "tests/"]
        # Optional: add --cov to get coverage report
        # args: ["-xvs", "--cov=digitalkin", "--cov-report=term-missing", "tests/"]
        # You can make this hook only run when Python files change
        types: [python]
