exclude: |
  (?x)^(
      .gitignore
  )$
# Every hook runs at commit time; only the template check also guards the push.
default_stages: [ pre-commit ]
# `pre-commit install` sets up both git hooks at once.
default_install_hook_types: [ pre-commit, pre-push ]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [ pre-commit ]
      - id: end-of-file-fixer
        stages: [ pre-commit ]
      - id: check-yaml
        exclude: mkdocs.yml
      - id: check-added-large-files
        stages: [ pre-commit ]
        args: ['--maxkb=1024']  # 1 MB

      - id: check-toml

  # ruff as local hooks so they run the project's LOCKED ruff over the whole repo,
  # matching CI (`uv run ruff check .`). The pinned mirrors-ruff rev drifted from the
  # lock's ruff, so preview rules (e.g. D421) fired in CI but not in pre-commit.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff-check
        entry: uv run ruff check --fix .
        language: system
        pass_filenames: false
        types: [python]
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format .
        language: system
        pass_filenames: false
        types: [python]

  # mypy as a local hook so it runs in the project env (real, typed deps),
  # matching `uv run mypy`. The isolated mirrors-mypy env lacked redis/grpc,
  # which made their required `# type: ignore` comments look unused.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src/digitalkin
        language: system
        pass_filenames: false
        types: [python]
        files: ^src/digitalkin/.*\.py$

  # The .env templates are generated from the settings classes. They also render
  # values defined outside models/settings (enums in models/services and
  # models/core) and depend on pydantic's version, so no file pattern covers
  # every source: the hook runs on every commit (~1 s).
  - repo: local
    hooks:
      - id: env-template
        name: env-template
        # Staged, not just written: pre-commit only reports "files were modified"
        # for *unstaged* changes, so adding them lets the regenerated templates
        # ride along in the same commit instead of forcing a second one.
        entry: bash -c 'uv run task env-template && git add -- .env.exemple .env.minimum'
        language: system
        pass_filenames: false
        always_run: true
      # Safety net for commits made with --no-verify or from a clone without
      # hooks: refuse to push templates that no longer match the code.
      - id: env-template-check
        name: env-template-check
        entry: uv run task env-template-check
        language: system
        pass_filenames: false
        always_run: true
        stages: [ pre-push ]

  # Add pytest as a local hook
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        # --build avoids stale images; TEST_MARKER env is honored by entrypoint-test.sh
        # (CLI args after the service name are ignored), so set the marker via env.
        entry: docker compose -f docker-compose.yml run --rm -T --build -e "TEST_MARKER=not integration" tests
        language: system
        pass_filenames: false
        types: [python]
        verbose: true
        files: ^(src/|tests/).*\.py$
        exclude: __version__\.py$
