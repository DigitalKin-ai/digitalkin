exclude: |
  (?x)^(
      .gitignore
  )$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: mkdocs.yml
      - id: check-added-large-files
        args: ['--maxkb=1024']  # 1 MB

      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        additional_dependencies: [types-protobuf]
        exclude: "^(tests/|examples/|scripts/)"

  # Add pytest as a local hook
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: docker compose run --rm -T tests pytest tests/ -m 'not integration'
        language: system
        pass_filenames: false
        types: [python]
        verbose: true
        files: ^(src/|tests/).*\.py$
        exclude: __version__\.py$
